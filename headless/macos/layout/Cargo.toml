[package]
name = "wfinfo-layout"
version = "0.1.0"
edition = "2024"
publish = false
description = "WFInfo macOS reward layout: Vision text lines in, reward slots out (C ABI, JSON in and out)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse doubles exactly as .NET does (the default parser can be 1 ulp off).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
